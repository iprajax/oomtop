name: Bug report
description: Something is wrong, crashes, or shows a number that doesn't match your OS.
title: "bug: "
labels: ["bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems go to a [private report](https://github.com/iprajax/oomtop/security/advisories/new), not here.**
        Questions ("how do I…?", "is this expected?") are answered faster in [Discussions](https://github.com/iprajax/oomtop/discussions/categories/q-a).

  - type: input
    id: version
    attributes:
      label: oomtop version
      description: Output of `oomtop --version`.
      placeholder: oomtop 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS, Apple Silicon
        - macOS, Intel
        - Linux, x86_64
        - Linux, aarch64
        - Linux in a container or VM
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and machine
      description: "macOS: `sw_vers -productVersion` and the Mac model. Linux: distribution, `uname -r`, and GPU if relevant."
      placeholder: "macOS 26.6, MacBook Air M5 24 GB  |  Ubuntu 24.04, 6.8.0-45, RTX 4090 (driver 550)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install oomtop?
      options:
        - Homebrew
        - install.sh
        - cargo install
        - .deb / .rpm
        - Release archive
        - Built from source (git clone)
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal (for display problems)
      description: Terminal app and version, plus tmux/SSH if used.
      placeholder: "Ghostty 1.2 inside tmux 3.5, TERM=xterm-256color"

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw. For a wrong number, say which process or group, what oomtop showed, and what you expected.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start `ollama serve` and load a 7B model
        2. Run `oomtop headroom --need 8G`
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: "`oomtop doctor` output"
      description: |
        Run `oomtop doctor` (or `oomtop doctor --json`) and paste the whole output. It lists every data source and terminal
        capability, and no command lines. Check it before posting and redact anything you consider private.
      render: text
    validations:
      required: true

  - type: textarea
    id: groundtruth
    attributes:
      label: Ground truth (for wrong numbers)
      description: |
        What your OS reports for the same thing, ideally taken right after oomtop's reading.
        macOS: `top -l 1 -o mem -n 20 -stats pid,mem,cmprs,command`, `vm_stat`, `sysctl vm.swapusage`.
        Linux: `free -b`, `cat /proc/<pid>/smaps_rollup`. Or `uv run tools/groundtruth/groundtruth.py --top 15` from a clone.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Config changes (`oomtop config print --origin`), flags, logs, screenshots. A redacted fixture (`tools/capture`) is gold.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed tokens, user names, host names and other private data from everything above.
          required: true
